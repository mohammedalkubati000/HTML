<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multiplication Table</title>
</head>
<body>

    <h2>جدول ضرب 5</h2>

    <button onclick="showTable()">Show Table</button>

    <div id="result"></div>

    <script>
        function showTable() {
            let result = "";

            for (let i = 1; i <= 15; i++) {
                result += "5 x " + i + " = " + (5 * i) + "<br>";
            }

            document.getElementById("result").innerHTML = result;
        }
    </script>

</body>
</html>
